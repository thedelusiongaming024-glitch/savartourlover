services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: savartourlover_app
    restart: always
    ports:
      - "80:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - .env.production
    volumes:
      # Persistent local database storage
      - ./data_storage:/app/.data
    # Caps this container at the same RAM as the entry-level DigitalOcean
    # droplet (1 vCPU / 512 MB) so local testing catches OOM issues before deploy.
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
